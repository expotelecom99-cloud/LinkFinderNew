<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>রিসিট নাম্বার খুজুন</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Tiro Bangla', serif;
    background: linear-gradient(to right, #a1c4fd, #c2e9fb);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

.container {
    background: #ffffff;
    padding: 30px 25px;
    border-radius: 15px;
    max-width: 400px;
    width: 90%;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    text-align: center;
}

h2 {
    margin-bottom: 25px;
    color: #333;
    font-size: 24px;
}

input[type="number"] {
    width: 90%;
    padding: 12px 15px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 16px;
    transition: 0.3s;
}

input[type="number"]:focus {
    border-color: #4caf50;
    box-shadow: 0 0 5px rgba(76,175,80,0.5);
    outline: none;
}

button {
    padding: 12px 25px;
    background: #4caf50;
    color: white;
    border: none;
    cursor: pointer;
    font-size: 16px;
    border-radius: 8px;
    transition: 0.3s;
    margin-top: 10px;
}

button:hover {
    background: #388e3c;
}

.result {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
    color: #333;
}

@media(max-width: 480px){
    h2 {
        font-size: 20px;
    }
    input[type="number"] {
        font-size: 14px;
        padding: 10px;
    }
    button {
        font-size: 14px;
        padding: 10px 20px;
    }
}
</style>
</head>
<body>

<div class="container">
    <h2>MR হিসাব ক্যালকুলেটর</h2>

    <input type="number" id="mr1" placeholder="সর্বশেষ MR নাম্বার (যেকোন একটি)">
    <input type="number" id="receive" placeholder="উপরের MR নাম্বার এর লিংক নাম্বার">
    <input type="number" id="mr2" placeholder="হারিয়ে যাওয়া রিসিট এর MR নাম্বার">
    
    <br>
    <button id="calcBtn">ক্লিক করুন</button>

    <div class="result" id="output"></div>
</div>

<script>
function calculate() {
    let mr1 = parseFloat(document.getElementById("mr1").value);
    let receive = parseFloat(document.getElementById("receive").value);
    let mr2 = parseFloat(document.getElementById("mr2").value);

    if (isNaN(mr1) || isNaN(receive) || isNaN(mr2)) {
        document.getElementById("output").innerHTML = "সব ঘর পূরণ করুন!";
        return;
    }

    let difference = mr2 - mr1;
    let finalResult = difference + receive;

    document.getElementById("output").innerHTML =
        "পার্থক্য: " + difference + "<br>ফাইনাল ফল: " + finalResult;
}

document.getElementById("calcBtn").addEventListener("click", calculate);

document.querySelectorAll("input").forEach(input => {
    input.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            calculate();
        }
    });
});
</script>

</body>
</html>
