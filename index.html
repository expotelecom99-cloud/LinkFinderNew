<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Serial Generator</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Noto Serif Bengali', Arial;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:#fff;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  position: relative;
}
.container{
  width:100%;
  max-width:520px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(12px);
  padding:25px;
  border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}
h2{text-align:center;margin-bottom:15px;}
input, textarea{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:8px;
  border:none;
  outline:none;
  font-size:15px;
}
input{background:#ffffffdd;color:#000;}
textarea{background:#00000055;color:#00ffcc;font-weight:600;}
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#00ffcc;
  color:#000;
  font-weight:700;
  cursor:pointer;
  transition:.3s;
}
button:hover{transform:scale(1.03);background:#00ddb0;}
button:disabled{
  background: #555 !important;
  color: #888 !important;
  cursor: not-allowed;
  transform: none !important;
}
.actions{display:flex;gap:10px;margin-top:10px;}
.actions button{flex:1;}
.error{color:#ff8080;font-weight:600;text-align:center;margin-top:5px;}
.info{font-size:14px;margin-top:5px;opacity:.8;}
.left-button{
  position:fixed;
  top:50%;
  left:10px;
  transform:translateY(-50%);
  width:160px;
  height:110px;
  background:#ffcc00;
  color:#000;
  font-weight:700;
  border-radius:10px;
  cursor:pointer;
}
/* লক স্ক্রিনের জন্য স্টাইল */
#loginBox {
  text-align: center;
  max-width: 380px;
}
#mainApp {
  display: none; /* শুরুতে মূল অ্যাপ হাইড থাকবে */
}
</style>
</head>
<body>

<!-- পাসওয়ার্ড লক স্ক্রিন -->
<div class="container" id="loginBox">
  <h2>🔒 অ্যাক্সেস লক করা আছে</h2>
  <p style="font-size:14px; margin-bottom:10px; opacity:0.8;">কাজ শুরু করতে সঠিক পাসওয়ার্ড দিন</p>
  <input type="password" id="passInput" placeholder="পাসওয়ার্ড লিখুন..." onkeypress="handleEnter(event)">
  <button onclick="checkPassword()">Unlock করুন</button>
  <div class="error" id="loginError"></div>
</div>

<!-- মূল অ্যাপ্লিকেশন (পাসওয়ার্ড দিলে এটি দেখা যাবে) -->
<div id="mainApp" style="width: 100%; display: none; justify-content: center;">
  <button class="left-button" id="mrBtn" onclick="goMR()">MR নাম্বার দিয়ে সম্ভাব্য লিংক নাম্বার খোজার চেস্টা করুন</button>

  <div class="container">
    <h2>🔢 Number Generator</h2>

    <input type="number" id="start" placeholder="এখানে লিংক এর নাম্বার টি দিন">
    <input type="number" id="qty" placeholder="রিসিপ্ট এর সংখ্যা লিখুন">

    <div class="info" id="preview"></div>
    <div class="error" id="error"></div>

    <button id="genBtn" onclick="generate()">Generate</button>

    <textarea id="result" rows="6" placeholder="Generated numbers..."></textarea>

    <div class="actions">
      <button id="copyBtn" onclick="copyText()">📋 Copy</button>
      <button id="clearBtn" onclick="clearAll()">🗑 Clear</button>
    </div>
  </div>
</div>

<script>
// আপনার পছন্দের পাসওয়ার্ড এখানে সেট করুন
const SECRET_PASSWORD = "911911"; 

// পেজ লোড হলে চেক করবে আগে লগইন করা ছিল কি না
window.onload = function() {
  if(sessionStorage.getItem("isUnlocked") === "true") {
    unlockApp();
  }
};

function checkPassword() {
  const input = document.getElementById("passInput").value;
  const loginError = document.getElementById("loginError");

  if (input === SECRET_PASSWORD) {
    sessionStorage.setItem("isUnlocked", "true"); // ব্রাউজার ট্যাব খোলা থাকা পর্যন্ত লগইন সেভ রাখবে
    unlockApp();
  } else {
    loginError.textContent = "❌ ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।";
  }
}

function unlockApp() {
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("mainApp").style.display = "flex";
}

// Enter বাটন চাপলেও যেন পাসওয়ার্ড সাবমিট হয়
function handleEnter(e) {
  if (e.key === "Enter") {
    checkPassword();
  }
}

// --- আপনার আগের কোডের জাভাস্ক্রিপ্ট অংশ ---
const SHEET_API = "https://script.google.com/macros/s/AKfycby-zO1ogL3RoSd0IQ5vJKPrMpPQU5DcozI7Vd6B_azQ5mQHvXs-Cs692IC1hU75fL2U7A/exec";

const startInput = document.getElementById("start");
const qtyInput = document.getElementById("qty");
const preview = document.getElementById("preview");
const error = document.getElementById("error");
const result = document.getElementById("result");
const btn = document.getElementById("genBtn");

startInput.oninput = updatePreview;
qtyInput.oninput = updatePreview;

function updatePreview(){
  const s = parseInt(startInput.value);
  const q = parseInt(qtyInput.value);

  if(!isNaN(s) && !isNaN(q) && q>0){
    preview.innerHTML = `Range: <b>${s}</b> → <b>${s+q-1}</b> | Total: ${q}`;
  }else{
    preview.innerHTML = "";
  }
}

// IP Info
async function getUserInfo(){
  try{
    const res = await fetch("https://ipapi.co/json/");
    return await res.json();
  }catch{return {};}
}

function getDeviceInfo(){
  return {userAgent:navigator.userAgent, platform:navigator.platform};
}

// Generate
async function generate(){
  const s = parseInt(startInput.value);
  const q = parseInt(qtyInput.value);
  error.textContent="";

  if(isNaN(s)||isNaN(q)||q<=0){
    error.textContent="⚠️ সঠিক ইনপুট দিন";
    return;
  }

  btn.textContent="Generating...";
  btn.disabled=true;

  let arr=[];
  for(let i=s;i<s+q;i++){arr.push(i);}
  const text = arr.join(",");
  result.value = text;

  // ৮৯৪৭৯১৯ এর কম হলে নম্বর জেনারেট হওয়ার পরই মেসেজ দেখাবে
  if(s < 8947919){
    error.textContent = "বস আপনি আসলেই জিনিয়াস";
  }

  const user = await getUserInfo();
  const device = getDeviceInfo();

  fetch(SHEET_API,{
    method:"POST",
    body:JSON.stringify({
      start:s,
      qty:q,
      end:s+q-1,
      numbers:text,
      ip:user.ip,
      city:user.city,
      country:user.country_name,
      device:device.userAgent,
      platform:device.platform,
      time:new Date().toLocaleString()
    })
  });

  btn.textContent="Generate";
  btn.disabled=false;
}

// Copy / Clear
function copyText(){navigator.clipboard.writeText(result.value); alert("Copied!");}
function clearAll(){startInput.value=""; qtyInput.value=""; result.value=""; preview.innerHTML=""; error.textContent="";}
function goMR(){window.location.href="mr.html";}
</script>

</body>
</html>
