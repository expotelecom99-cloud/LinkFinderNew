<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Serial Generator</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Noto Serif Bengali', Arial;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:#fff;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  position: relative;
}
.container{
  width:100%;
  max-width:520px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(12px);
  padding:25px;
  border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}
h2{text-align:center;margin-bottom:15px;}
input, textarea{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:8px;
  border:none;
  outline:none;
  font-size:15px;
}
input{background:#ffffffdd;color:#000;}
textarea{background:#00000055;color:#00ffcc;font-weight:600;}
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#00ffcc;
  color:#000;
  font-weight:700;
  cursor:pointer;
  transition:.3s;
}
button:hover{transform:scale(1.03);background:#00ddb0;}
button:disabled{
  background: #555 !important;
  color: #888 !important;
  cursor: not-allowed;
  transform: none !important;
}
.actions{display:flex;gap:10px;margin-top:10px;}
.actions button{flex:1;}
.error{color:#ff8080;font-weight:600;text-align:center;margin-top:5px;}
.info{font-size:14px;margin-top:5px;opacity:.8;}
.left-button{
  position:fixed;
  top:50%;
  left:10px;
  transform:translateY(-50%);
  width:160px;
  height:110px;
  background:#ffcc00;
  color:#000;
  font-weight:700;
  border-radius:10px;
  cursor:pointer;
  z-index: 1000;
}
#loginBox {
  text-align: center;
  max-width: 380px;
}
#mainApp {
  width: 100%; 
  display: none; 
  justify-content: center;
}
</style>
</head>
<body>

<!-- লগইন স্ক্রিন -->
<div class="container" id="loginBox">
  <h2>🔒 লগইন করুন</h2>
  <p style="font-size:14px; margin-bottom:15px; opacity:0.8;">মূল সার্ভারে লগইন করতে তথ্য দিন</p>
  
  <!-- এখানে form সাবমিট করার সাথে সাথে সার্ভার নতুন ট্যাবে খুলবে এবং এই ট্যাবটি মূল টুলে চলে যাবে -->
  <form action="http://122.152.50.54:81/cnf_final/final/cms/admin/?app=admin&action=_login" method="post" target="_blank" onsubmit="handleLoginSubmit()">
    <input type="text" name="data[username]" placeholder="ইউজারনেম লিখুন..." required>
    <input type="password" name="data[password]" placeholder="পাসওয়ার্ড লিখুন..." required>
    
    <button type="submit" style="margin-top: 10px;">লগইন করুন ও টুলটি চালু করুন</button>
  </form>

  <!-- ব্যাকআপ বাটন -->
  <button type="button" onclick="unlockApp()" style="margin-top: 15px; background: #ffcc00; color: #000;">লগইন করা থাকলে সরাসরি এখানে ক্লিক করুন</button>
</div>

<!-- মূল অ্যাপ্লিকেশন -->
<div id="mainApp">
  <button class="left-button" id="mrBtn" onclick="goMR()">MR নাম্বার দিয়ে সম্ভাব্য লিংক নাম্বার খোজার চেস্টা করুন</button>

  <div class="container">
    <h2>🔢 Number Generator</h2>

    <input type="number" id="start" placeholder="এখানে লিংক এর নাম্বার টি দিন">
    <input type="number" id="qty" placeholder="রিসিপ্ট এর সংখ্যা লিখুন">

    <div class="info" id="preview"></div>
    <div class="error" id="error"></div>

    <button id="genBtn" onclick="generate()">Generate</button>

    <textarea id="result" rows="6" placeholder="Generated numbers..."></textarea>

    <div class="actions">
      <button id="copyBtn" onclick="copyText()">📋 Copy</button>
      <button id="clearBtn" onclick="clearAll()">🗑 Clear</button>
    </div>
  </div>
</div>

<script>
window.onload = function() {
  if(localStorage.getItem("isUnlocked") === "true") {
    unlockApp();
  }
};

function handleLoginSubmit() {
  localStorage.setItem("isUnlocked", "true");
  // সামান্য সময় নিয়ে মূল স্ক্রিনটি সামনে নিয়ে আসবে যাতে নতুন ট্যাব ওপেন হওয়ার পর এই পেজটিও সচল থাকে
  setTimeout(function() {
    unlockApp();
  }, 500);
}

function unlockApp() {
  localStorage.setItem("isUnlocked", "true");
  
  const loginBox = document.getElementById("loginBox");
  const mainApp = document.getElementById("mainApp");
  
  if(loginBox) loginBox.style.display = "none";
  if(mainApp) mainApp.style.display = "flex";
}

// --- জেনারেটর কোড ---
const SHEET_API = "https://script.google.com/macros/s/AKfycby-zO1ogL3RoSd0IQ5vJKPrMpPQU5DcozI7Vd6B_azQ5mQHvXs-Cs692IC1hU75fL2U7A/exec";

const startInput = document.getElementById("start");
const qtyInput = document.getElementById("qty");
const preview = document.getElementById("preview");
const error = document.getElementById("error");
const result = document.getElementById("result");
const btn = document.getElementById("genBtn");

startInput.oninput = updatePreview;
qtyInput.oninput = updatePreview;

function updatePreview(){
  const s = parseInt(startInput.value);
  const q = parseInt(qtyInput.value);

  if(!isNaN(s) && !isNaN(q) && q>0){
    preview.innerHTML = `Range: <b>${s}</b> → <b>${s+q-1}</b> | Total: ${q}`;
  }else{
    preview.innerHTML = "";
  }
}

async function getUserInfo(){
  try{
    const res = await fetch("https://ipapi.co/json/");
    return await res.json();
  }catch{return {};}
}

function getDeviceInfo(){
  return {userAgent:navigator.userAgent, platform:navigator.platform};
}

async function generate(){
  const s = parseInt(startInput.value);
  const q = parseInt(qtyInput.value);
  error.textContent="";

  if(isNaN(s)||isNaN(q)||q<=0){
    error.textContent="⚠️ সঠিক ইনপুট দিন";
    return;
  }

  btn.textContent="Generating...";
  btn.disabled=true;

  let arr=[];
  for(let i=s;i<s+q;i++){arr.push(i);}
  const text = arr.join(",");
  result.value = text;

  if(s < 8947919){
    error.textContent = "বস আপনি আসলেই জিনিয়াস";
  }

  const user = await getUserInfo();
  const device = getDeviceInfo();

  fetch(SHEET_API,{
    method:"POST",
    body:JSON.stringify({
      start:s,
      qty:q,
      end:s+q-1,
      numbers:text,
      ip:user.ip,
      city:user.city,
      country:user.country_name,
      device:device.userAgent,
      platform:device.platform,
      time:new Date().toLocaleString()
    })
  });

  btn.textContent="Generate";
  btn.disabled=false;
}

function copyText(){navigator.clipboard.writeText(result.value); alert("Copied!");}
function clearAll(){startInput.value=""; qtyInput.value=""; result.value=""; preview.innerHTML=""; error.textContent="";}
function goMR(){window.location.href="mr.html";}
</script>

</body>
</html>
