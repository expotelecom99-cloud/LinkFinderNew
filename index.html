<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serial Generator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --primary: #4f46e5;
    --primary-dark: #4338ca;
    --accent: #06b6d4;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --bg-input: #f8fafc;
    --error: #ef4444;
    --success: #10b981;
    --warn: #f59e0b;
}

* { box-sizing: border-box; }

body {
    font-family: 'Hind Siliguri', sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: var(--text);
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #06b6d4 100%);
    background-size: 200% 200%;
    animation: bgMove 12s ease infinite;
}

@keyframes bgMove {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

@keyframes popIn {
    from { opacity: 0; transform: translateY(25px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25%      { transform: translateX(-6px); }
    75%      { transform: translateX(6px); }
}

.container {
    width: 100%;
    max-width: 480px;
    padding: 32px 26px 26px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 22px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    animation: popIn 0.6s ease;
}

.icon {
    width: 62px;
    height: 62px;
    margin: 0 auto 12px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    color: #fff;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4);
}

h2 {
    margin: 0 0 6px;
    text-align: center;
    font-size: 25px;
    font-weight: 700;
}

.subtitle {
    margin: 0 0 22px;
    text-align: center;
    font-size: 14px;
    color: var(--muted);
}

.field { margin-bottom: 14px; position: relative; }

label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    font-weight: 600;
}

input, select, textarea {
    width: 100%;
    padding: 12px 14px;
    font-family: inherit;
    font-size: 16px;
    color: var(--text);
    background: var(--bg-input);
    border: 2px solid var(--border);
    border-radius: 12px;
    transition: all 0.25s ease;
}

input[type="number"] { -moz-appearance: textfield; }
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

input::placeholder, textarea::placeholder { color: #a0aec0; }

input:focus, select:focus, textarea:focus {
    outline: none;
    background: #fff;
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
}

input.invalid { border-color: var(--error); background: #fef2f2; animation: shake 0.35s; }

textarea {
    resize: vertical;
    min-height: 130px;
    font-weight: 600;
    color: #0f766e;
    background: #f0fdfa;
    border-color: #99f6e4;
}

.row { display: flex; gap: 10px; }
.row > * { flex: 1; }

button {
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    padding: 12px 16px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.25s ease;
}

button:disabled { opacity: 0.55; cursor: not-allowed; transform: none !important; }

.btn-primary {
    width: 100%;
    margin-top: 6px;
    color: #fff;
    font-size: 16px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
}
.btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(79, 70, 229, 0.45); }

.btn-light { color: var(--text); background: #f1f5f9; }
.btn-light:hover:not(:disabled) { background: #e2e8f0; }

.btn-link {
    display: block;
    width: 100%;
    margin-bottom: 10px;
    padding: 11px 14px;
    font-size: 14px;
    color: #92400e;
    background: #fef3c7;
    border: 1px dashed #fbbf24;
    text-align: center;
}
.btn-link:hover { background: #fde68a; }

.btn-link-finder {
    margin-bottom: 20px;
    color: #0f766e;
    background: #ccfbf1;
    border-color: #2dd4bf;
}
.btn-link-finder:hover { background: #99f6e4; }

.pw-toggle {
    position: absolute;
    right: 8px;
    bottom: 6px;
    padding: 6px 10px;
    font-size: 18px;
    background: transparent;
    line-height: 1;
}

.msg {
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    display: none;
}
.msg.show { display: block; animation: popIn 0.3s ease; }
.msg.error { color: var(--error); background: #fef2f2; }
.msg.warn  { color: #92400e; background: #fef3c7; }

.preview {
    min-height: 22px;
    margin: 4px 0 10px;
    font-size: 14px;
    color: var(--muted);
}
.preview b { color: var(--primary); }

.actions { display: flex; gap: 8px; margin-top: 10px; }
.actions button { flex: 1; padding: 11px 8px; font-size: 14px; }

.history { margin-top: 20px; display: none; }
.history.show { display: block; }
.history h3 { margin: 0 0 8px; font-size: 14px; color: var(--muted); font-weight: 600; }
.history-item {
    display: flex;
    justify-content: space-between;
    width: 100%;
    margin-bottom: 6px;
    padding: 9px 12px;
    font-size: 13px;
    text-align: left;
    color: var(--text);
    background: #f8fafc;
    border: 1px solid var(--border);
}
.history-item:hover { border-color: var(--primary); background: #eef2ff; }
.history-item span:last-child { color: var(--muted); }

.notice {
    margin-top: 18px;
    font-size: 12px;
    text-align: center;
    color: var(--muted);
}

#mainApp { display: none; width: 100%; justify-content: center; }

#toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(30px);
    padding: 11px 20px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    background: #1e293b;
    border-radius: 30px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 10;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 480px) {
    .container { padding: 26px 18px 22px; }
    h2 { font-size: 21px; }
    input, select, textarea { font-size: 15px; }
}
</style>
</head>
<body>

<!-- লগইন -->
<div class="container" id="loginBox">
    <div class="icon">🔒</div>
    <h2>অ্যাক্সেস লক করা আছে</h2>
    <p class="subtitle">কাজ শুরু করতে সঠিক পাসওয়ার্ড দিন</p>

    <div class="field">
        <label for="passInput">পাসওয়ার্ড</label>
        <input type="password" id="passInput" placeholder="পাসওয়ার্ড লিখুন..." autocomplete="current-password">
        <button type="button" class="pw-toggle" id="pwToggle" aria-label="পাসওয়ার্ড দেখান">👁️</button>
    </div>

    <button class="btn-primary" id="unlockBtn">Unlock করুন</button>
    <div class="msg error" id="loginError"></div>
    <p class="notice"></p>
</div>

<!-- মূল অ্যাপ -->
<div id="mainApp">
    <div class="container">
        <button class="btn-link" id="mrBtn">🔎লিংক নাম্বার খোঁজার চেষ্টা করুন</button>
        <button class="btn-link btn-link-finder" id="finderBtn">🧾 Receipt Auto Finder Pro V.1</button>

        <div class="icon">🔢</div>
        <h2>Number Generator</h2>
        <p class="subtitle">লিংক নাম্বার থেকে রিসিটের সিরিয়াল তৈরি করুন</p>

        <div class="field">
            <label for="start">লিংক নাম্বার</label>
            <input type="number" id="start" placeholder="এখানে লিংকের নাম্বারটি দিন" inputmode="numeric">
        </div>

        <div class="field">
            <label for="qty">রিসিটের সংখ্যা</label>
            <input type="number" id="qty" placeholder="কতগুলো নাম্বার দরকার?" inputmode="numeric">
        </div>

        <div class="field">
            <label for="format">আউটপুট ফরম্যাট</label>
            <select id="format">
                <option value=",">কমা দিয়ে আলাদা (১,২,৩)</option>
                <option value="\n">প্রতি লাইনে একটি</option>
                <option value=" ">স্পেস দিয়ে আলাদা</option>
            </select>
        </div>

        <div class="preview" id="preview"></div>
        <div class="msg error" id="error"></div>
        <div class="msg warn" id="special"></div>

        <button class="btn-primary" id="genBtn">Generate</button>

        <div class="field" style="margin-top:14px">
            <textarea id="result" rows="6" placeholder="Generated numbers..."></textarea>
        </div>

        <div class="actions">
            <button class="btn-light" id="copyBtn">📋 Copy</button>
            <button class="btn-light" id="downloadBtn">⬇️ Download</button>
            <button class="btn-light" id="clearBtn">🗑 Clear</button>
        </div>

        <div class="history" id="history">
            <h3>সাম্প্রতিক হিসাব (ক্লিক করলে আবার বসবে)</h3>
            <div id="historyList"></div>
        </div>
    </div>
</div>

<div id="toast"></div>
